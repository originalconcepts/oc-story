name: Release

# Tag a version (e.g. `git tag v0.1.1 && git push --tags`) and this builds
# oc-story.zip and publishes it as a GitHub release asset — which is exactly
# what the in-plugin updater looks for.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HDR="$(grep -m1 -E '^\s*\*\s*Version:' oc-story.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')"
          echo "tag=$TAG header=$HDR"
          if [ "$TAG" != "$HDR" ]; then
            echo "::error::Tag v$TAG does not match plugin header version $HDR"
            exit 1
          fi

      - name: Build package
        run: bash bin/build-zip.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/oc-story.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
