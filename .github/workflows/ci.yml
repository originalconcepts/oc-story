name: CI

on:
  push:
    # Every branch, not only main. A feature branch big enough to need one is
    # exactly where the tests are worth having, and this repository's only PHP
    # runtime is this workflow.
    branches: [ '**' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint all PHP files
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      # The harness names every check it runs, and the failing lines are the
      # whole diagnosis — but a run's logs are readable only by someone with
      # write access to the repository, and the person who most needs them is
      # often not that someone. The job summary is public to anyone who can
      # see the run, so the failures go there too.
      - name: Run the logic test harness
        run: |
          set +e
          php tests/logic-test.php | tee /tmp/logic.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Logic harness — PHP ${{ matrix.php }}"
              echo ''
              echo '```'
              grep -E 'FAIL|Fatal|Parse error|^[0-9]+ passed' /tmp/logic.txt | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  js:
    runs-on: ubuntu-latest
    name: JavaScript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The MP4 muxer and demuxer are pure byte layout, so they can be round
      # tripped without a browser. Whether a phone decodes the result is what
      # tests/encoder-test.html answers, on the phone.
      - name: Round trip the MP4 muxer
        run: node tests/mp4-test.mjs

      # PLAN.md section 10 sets what the storefront may download. Checking it
      # here is what stops the budget quietly becoming a paragraph.
      - name: Check the front-end performance budget
        run: node tests/budget.mjs
