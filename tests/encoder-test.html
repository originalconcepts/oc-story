<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OC Story — בדיקת קידוד במכשיר</title>
<style>
	:root { color-scheme: light dark; }
	body { font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; max-width: 720px; }
	h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
	p.sub { margin: 0 0 20px; opacity: .7; font-size: 14px; }
	.row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(128,128,128,.25); font-size: 14px; }
	.row b { font-weight: 500; }
	.ok { color: #1d9e75; } .bad { color: #d94040; }
	input[type=file] { display: block; margin: 16px 0; font-size: 16px; }
	progress { width: 100%; height: 10px; margin: 12px 0; }
	video { width: 100%; max-width: 320px; border-radius: 12px; background: #000; display: block; margin: 16px 0; }
	img { width: 96px; height: 96px; object-fit: cover; border-radius: 50%; }
	pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: rgba(128,128,128,.12); padding: 12px; border-radius: 8px; }
	section { margin-top: 24px; }
</style>
</head>
<body>

<h1>בדיקת קידוד במכשיר</h1>
<p class="sub">אבן דרך 2 — השער של הפרויקט. בחר סרטון מהגלריה. אם המספרים למטה נראים טובים והסרטון מתנגן, הקידוד בצד הלקוח מחזיק.</p>

<div id="support"></div>

<input type="file" accept="video/*" id="file">
<progress id="progress" value="0" max="1" hidden></progress>

<section id="out"></section>

<script type="module">
import { encode, isSupported } from '../assets/js/encoder.js';

const support = document.getElementById( 'support' );
const out = document.getElementById( 'out' );
const progress = document.getElementById( 'progress' );

function row( label, value, state ) {
	const cls = state === true ? 'ok' : state === false ? 'bad' : '';
	return '<div class="row"><span>' + label + '</span><b class="' + cls + '">' + value + '</b></div>';
}

function mb( bytes ) {
	return ( bytes / 1048576 ).toFixed( 1 ) + 'MB';
}

const ok = isSupported();
support.innerHTML =
	row( 'WebCodecs', ok ? 'זמין' : 'לא זמין', ok ) +
	row( 'OffscreenCanvas', typeof OffscreenCanvas !== 'undefined' ? 'זמין' : 'חלופה לקנבס רגיל', typeof OffscreenCanvas !== 'undefined' ) +
	row( 'דפדפן', navigator.userAgent.slice( 0, 60 ) + '…' );

if ( ! ok ) {
	support.innerHTML += '<p class="bad">המכשיר הזה ייפול למסלול החלופי: העלאה בלי דחיסה. זה בדיוק המקרה שהשער אמור לגלות.</p>';
}

document.getElementById( 'file' ).addEventListener( 'change', async ( event ) => {
	const file = event.target.files[ 0 ];
	if ( ! file ) {
		return;
	}

	out.innerHTML = '';
	progress.hidden = false;
	progress.value = 0;

	const started = performance.now();

	try {
		const result = await encode( file, {}, ( value ) => {
			progress.value = value;
		} );

		const seconds = ( performance.now() - started ) / 1000;
		const ratio = result.sourceBytes / result.bytes;

		out.innerHTML =
			row( 'מקור', mb( result.sourceBytes ) ) +
			row( 'אחרי קידוד', mb( result.bytes ), result.bytes < result.sourceBytes ) +
			row( 'יחס דחיסה', ratio.toFixed( 1 ) + '×', ratio > 3 ) +
			row( 'מידות', result.width + '×' + result.height ) +
			row( 'אורך', result.duration + ' שניות' ) +
			row( 'זמן קידוד', seconds.toFixed( 1 ) + ' שניות', seconds < result.duration * 2 ) +
			row( 'קצב', ( result.duration / seconds ).toFixed( 1 ) + '× זמן אמת', result.duration / seconds > 1 );

		if ( result.poster ) {
			const img = new Image();
			img.src = result.poster;
			out.appendChild( img );
		}

		const video = document.createElement( 'video' );
		video.controls = true;
		video.playsInline = true;
		video.preload = 'metadata';
		video.src = URL.createObjectURL( result.blob );
		out.appendChild( video );

		const verdict = document.createElement( 'p' );
		video.addEventListener( 'loadedmetadata', () => {
			verdict.innerHTML = row(
				'הדפדפן קורא את הקובץ שלנו',
				'כן — ' + video.videoWidth + '×' + video.videoHeight + ', ' + video.duration.toFixed( 1 ) + 's',
				true
			);
		} );
		video.addEventListener( 'error', () => {
			verdict.innerHTML = row( 'הדפדפן קורא את הקובץ שלנו', 'לא — המוקסר שבור', false );
		} );
		out.appendChild( verdict );

		const download = document.createElement( 'a' );
		download.href = video.src;
		download.download = 'oc-story-test.mp4';
		download.textContent = 'הורד את הקובץ כדי לבדוק אותו במקום אחר';
		out.appendChild( download );
	} catch ( e ) {
		out.innerHTML = row( 'נכשל', e.message || String( e ), false );
		out.innerHTML += '<pre>' + ( e.stack || '' ) + '</pre>';
	} finally {
		progress.hidden = true;
	}
} );
</script>

</body>
</html>
